services:
  - type: web
    name: library-management-system
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: libms-db
          property: connectionString
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx256m"
    healthCheckPath: /api/books
    autoDeploy: true
databases:
  - name: libms-db
    plan: free
    databaseName: libms
